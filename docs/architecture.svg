<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 600" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>VeriChain system architecture</title>
  <desc>Frontend on Vercel talks to a backend API on Hugging Face for AI services and directly to Mantle smart contracts via the user's wallet. The backend persists data to MongoDB.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- FRONTEND -->
  <rect x="190" y="40" width="300" height="96" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="66" text-anchor="middle" font-size="15" font-weight="500" fill="#0C447C">Frontend — React + Vite + TS</text>
  <text x="340" y="86" text-anchor="middle" font-size="12" fill="#185FA5">Vercel · veri-chain-client.vercel.app</text>
  <text x="340" y="108" text-anchor="middle" font-size="12" fill="#185FA5">Landing · Dashboard · Explorer</text>
  <text x="340" y="124" text-anchor="middle" font-size="12" fill="#185FA5">Agent Reputation</text>

  <!-- left arrow: AI services -->
  <line x1="270" y1="136" x2="200" y2="300" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="220" font-size="12" fill="#5F5E5A">AI services</text>
  <text x="150" y="236" font-size="12" fill="#5F5E5A">(REST)</text>

  <!-- right arrow: wallet -->
  <line x1="430" y1="136" x2="500" y2="300" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="486" y="220" font-size="12" fill="#5F5E5A">Wallet signs</text>
  <text x="486" y="236" font-size="12" fill="#5F5E5A">(wagmi / viem)</text>

  <!-- BACKEND -->
  <rect x="40" y="300" width="290" height="150" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="185" y="326" text-anchor="middle" font-size="15" font-weight="500" fill="#085041">Backend API — Node + Express</text>
  <text x="185" y="346" text-anchor="middle" font-size="12" fill="#0F6E56">Hugging Face Space</text>
  <text x="185" y="372" text-anchor="middle" font-size="12" fill="#0F6E56">OCR (Tesseract / pdf-parse)</text>
  <text x="185" y="390" text-anchor="middle" font-size="12" fill="#0F6E56">Rule engine + 5 AI agents</text>
  <text x="185" y="408" text-anchor="middle" font-size="12" fill="#0F6E56">Gemini integration</text>
  <text x="185" y="426" text-anchor="middle" font-size="12" fill="#0F6E56">Risk aggregation</text>

  <!-- MANTLE -->
  <rect x="380" y="300" width="260" height="150" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="510" y="326" text-anchor="middle" font-size="15" font-weight="500" fill="#26215C">Mantle Sepolia (5003)</text>
  <text x="510" y="356" text-anchor="middle" font-size="12" fill="#534AB7">VeriChainRegistry</text>
  <text x="510" y="372" text-anchor="middle" font-size="12" fill="#534AB7">(verification proofs)</text>
  <text x="510" y="400" text-anchor="middle" font-size="12" fill="#534AB7">ERC-8004 Identity Registry</text>
  <text x="510" y="416" text-anchor="middle" font-size="12" fill="#534AB7">(agent NFTs 108–112)</text>

  <!-- backend -> mongo -->
  <line x1="185" y1="450" x2="185" y2="520" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- MONGODB -->
  <rect x="70" y="520" width="230" height="56" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="185" y="544" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">MongoDB</text>
  <text x="185" y="562" text-anchor="middle" font-size="12" fill="#5F5E5A">documents · verifications · agent_logs</text>
</svg>
